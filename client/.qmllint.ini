# qmllint policy for the Stream module.
#
# A warning is an error here.  QML's mistakes -- an unqualified identifier, a
# renamed property, a type that does not exist, a binding loop -- are runtime
# failures the compiler cannot see, so this file is the only thing standing
# between a typo and a blank screen.  `client/lint.sh` runs qmllint over every
# file listed in CMakeLists.txt and fails the build on a non-zero exit.
#
# What is switched off, and why:
#
#   CompilerWarnings / LintPluginWarnings  qmllint's own `--bare` mode already
#       skips these, and the QML compiler that builds the module reports its own
#       diagnostics.  Keeping them on would mean two sources of truth about
#       which warnings exist.
#
#   AttachedPropertyReuse / ControlsAttachedPropertyReuse  These fire on the
#       idiomatic `anchors.leftMargin: Theme.spaceLg` pattern when the same
#       attached property is touched again in a nested scope, which every
#       layout in this project does on purpose.
#
#   FunctionUsedBeforeDeclaration / Shadow  Declaration order in QML is not
#       JavaScript's: a `function` at the bottom of a component is callable from
#       a binding above it, and that is how every screen here is written.
#
#   Void  A `function` whose result is discarded is a signal handler or a
#       deliberate fire-and-forget call.  Every `screen.submit()` in this
#       project is one.
#
#   QtDesignStudio.*  This project is not edited in Qt Design Studio, and
#       `.ui.qml` files are not used.
#
# Left on, deliberately: UnqualifiedAccess, MissingProperty, MissingType,
# DuplicatePropertyBinding, ReadOnlyProperty, RequiredProperty,
# PropertyOverride, IncompatibleType, Quick.* (anchors, layout positioning,
# colours, attached-property types), StalePropertyRead, and the rest.  Those
# are the ones that catch real bugs.

[General]
DisableDefaultImports = false
# -1 is "every warning counts".  Anything lower makes a new warning invisible
# once the existing ones reach the limit, which is exactly backwards.
MaxWarnings = -1

[Warnings]
CompilerWarnings = disable
LintPluginWarnings = disable
AttachedPropertyReuse = disable
Quick.AttachedPropertyReuse = disable
Quick.ControlsAttachedPropertyReuse = disable
FunctionUsedBeforeDeclaration = disable
Shadow = disable
Void = disable
QtDesignStudio.FunctionsNotSupportedInQmlUi = disable
QtDesignStudio.ImperativeCodeNotEditableInVisualDesigner = disable
QtDesignStudio.InvalidIdeInVisualDesigner = disable
QtDesignStudio.ReferenceToParentItemNotSupportedByVisualDesigner = disable
QtDesignStudio.UnsupportedTypeInQmlUi = disable
QtDesignStudio.UnsupportedRootTypeInQmlUi = disable

[Options]
# `session`, `api`, `credentials` and `controller` are QML context properties
# injected from C++ in main.cpp, so the linter has nothing to resolve them
# against and every use is a false positive.  The `App` singleton exists
# precisely so the UI itself can be written without them; Main.qml is the only
# file that may reach for these four, and it does so once, at startup.
UnqualifiedNames = qmllint
